name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest==8.3.3
      - name: Run pause-condition tests
        run: python -m pytest tests/test_pause_condition.py -v
      - name: Run Task 01 starter tests
        run: |
          cd tasks/task_01_extract_and_type/repo
          python -m pytest tests -v
      - name: Verify acceptance tests fail on starter
        run: |
          python -m pip install -r tasks/task_01_extract_and_type/requirements-acceptance.txt
          python -m pytest tasks/task_01_extract_and_type/tests_acceptance -q > acceptance-baseline.txt 2>&1 && exit 1 || status=$?
          cat acceptance-baseline.txt
          test "$status" -eq 1
          grep -q "4 failed, 2 passed" acceptance-baseline.txt
      - name: Run mock orchestrator tests
        run: python -m pytest tests/test_orchestrator.py -v
      - name: Run scripted mock demo
        run: python scripts/demo_mock_run.py
      - name: Upload scripted mock artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripted-mock-artifacts
          path: mock-run-artifacts/
      - name: Run report tests
        run: python -m pytest tests/test_report.py -v
      - name: Run fake-client adapter tests
        run: python -m pytest tests/test_adapter.py -v
      - name: Run mocked Anthropic client tests
        run: python -m pytest tests/test_anthropic_client.py -v
      - name: Build tester image
        run: docker build -f docker/tester/Dockerfile -t swe-adapt-tester .

      - name: Smoke-test tester image
        run: |
          tempdir="$(mktemp -d)"
          trap 'rm -rf "$tempdir"' EXIT
          cp -a tasks/task_01_extract_and_type/repo/. "$tempdir/"
          SENTINEL_SECRET=fake-sentinel-12345 docker run --rm \
            --network none \
            --cpus=1 --memory=512m --pids-limit=64 \
            --cap-drop ALL --security-opt no-new-privileges \
            -v "$tempdir:/workspace:ro" \
            swe-adapt-tester pytest /smoke -v
      - name: Verify Docker pause runner
        run: python -m pytest tests/test_docker_runner.py tests/test_live_mode.py tests/test_docker_integration.py -v
      - name: Verify Docker final acceptance
        run: python -m pytest tests/test_docker_acceptance.py -v
      - name: End-to-end Docker test with fake agent
        run: python -m pytest tests/test_end_to_end.py -v
